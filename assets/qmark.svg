<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="QUANTSIGNAL AI">
  <defs>
    <linearGradient id="qGrad" x1="20%" y1="10%" x2="80%" y2="100%">
      <stop offset="0" stop-color="#5ef9ff"/>
      <stop offset="55%" stop-color="#26e6f2"/>
      <stop offset="100%" stop-color="#0c8c97"/>
    </linearGradient>
    <linearGradient id="qShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0" stop-color="#ff8a2b"/>
      <stop offset="100%" stop-color="#ffb547"/>
    </linearGradient>
    <radialGradient id="qHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="rgba(38,230,242,0.55)"/>
      <stop offset="60%" stop-color="rgba(38,230,242,0.10)"/>
      <stop offset="100%" stop-color="rgba(38,230,242,0)"/>
    </radialGradient>
    <filter id="qBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
  </defs>

  <circle cx="100" cy="100" r="96" fill="url(#qHalo)" opacity="0.85"/>

  <g>
    <circle cx="100" cy="100" r="62" fill="none" stroke="url(#qGrad)" stroke-width="22" stroke-linecap="round"/>
    <circle cx="100" cy="100" r="62" fill="none" stroke="url(#qShine)" stroke-width="6" stroke-linecap="round"/>
    <path d="M128 128 L168 168" stroke="url(#qGrad)" stroke-width="22" stroke-linecap="round"/>
    <path d="M128 128 L168 168" stroke="url(#qShine)" stroke-width="6" stroke-linecap="round"/>
  </g>

  <g filter="url(#qBlur)" opacity="0.55">
    <path d="M104 134 L150 76 L150 60" fill="none" stroke="#ff8a2b" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <path d="M104 134 L150 76" stroke="url(#arrowGrad)" stroke-width="18" stroke-linecap="round"/>
  <path d="M150 76 L150 56 M150 76 L130 76" stroke="url(#arrowGrad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M122 100 L152 70" stroke="rgba(255,220,180,0.6)" stroke-width="4" stroke-linecap="round"/>
</svg>
