<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="QUANTSIGNAL AI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05060A"/>
      <stop offset="55%" stop-color="#0A0F1C"/>
      <stop offset="100%" stop-color="#101a2e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#22D3C0" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#3A8DFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#8A5CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="qStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5EF9FF"/>
      <stop offset="50%" stop-color="#22D3C0"/>
      <stop offset="100%" stop-color="#3A8DFF"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8A5CFF"/>
      <stop offset="100%" stop-color="#3A8DFF"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Squircle background -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#glow)"/>

  <!-- Subtle grid -->
  <g opacity="0.10" stroke="#8A9BB5" stroke-width="1">
    <line x1="0"   y1="128" x2="512" y2="128"/>
    <line x1="0"   y1="256" x2="512" y2="256"/>
    <line x1="0"   y1="384" x2="512" y2="384"/>
    <line x1="128" y1="0"   x2="128" y2="512"/>
    <line x1="256" y1="0"   x2="256" y2="512"/>
    <line x1="384" y1="0"   x2="384" y2="512"/>
  </g>

  <!-- Q mark -->
  <g transform="translate(256 256)">
    <circle cx="0" cy="0" r="140" fill="none" stroke="url(#qStroke)" stroke-width="40" stroke-linecap="round"/>
    <path d="M70 70 L150 150" stroke="url(#qStroke)" stroke-width="40" stroke-linecap="round"/>
    <!-- Trend arrow inside the Q -->
    <g filter="url(#soft)" opacity="0.65">
      <path d="M-60 50 L40 -50 L40 -90" fill="none" stroke="#8A5CFF" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <path d="M-60 50 L40 -50" stroke="url(#arrow)" stroke-width="28" stroke-linecap="round"/>
    <path d="M40 -50 L40 -90 M40 -50 L0 -50" stroke="url(#arrow)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- AI mark -->
  <g transform="translate(256 432)">
    <text x="0" y="0" fill="#E9EEF7" font-family="Inter, Segoe UI, sans-serif" font-size="44" font-weight="800" letter-spacing="6" text-anchor="middle">AI</text>
  </g>
</svg>
